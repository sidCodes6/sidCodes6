<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Siddalinga - Data Science and Data Analytics</title>
  <desc id="desc">A dark navy profile banner with electric blue and crimson accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070b16"/><stop offset="1" stop-color="#101b31"/></linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#247bff" opacity=".25"/></pattern>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="24" fill="url(#dots)"/>
  <rect width="760" height="8" fill="#247bff"/><rect x="760" width="440" height="8" fill="#ff3554"/>
  <text x="70" y="65" fill="#9aaac2" font-family="monospace" font-size="18" letter-spacing="4">SIDDALINGA / DATA SCIENCE</text>
  <text x="70" y="150" fill="#f3f6ff" font-family="Arial, sans-serif" font-size="62" font-weight="800">DATA INTO INSIGHT.</text>
  <text x="70" y="204" fill="#247bff" font-family="Arial, sans-serif" font-size="42" font-weight="800">BUILD. ANALYZE. LEARN.</text>
  <text x="70" y="250" fill="#9aaac2" font-family="Arial, sans-serif" font-size="20">Python • SQL • Machine Learning • Visualization • Dashboards</text>
  <circle cx="1055" cy="145" r="82" fill="#101b31" stroke="#247bff" stroke-width="2"/>
  <text x="1055" y="140" text-anchor="middle" fill="#ff3554" font-family="monospace" font-size="24">DATA</text>
  <text x="1055" y="170" text-anchor="middle" fill="#f3f6ff" font-family="monospace" font-size="16">SCIENCE</text>
</svg>
